name: shell-matrix
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets

  unix-shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: cargo build
      - shell: bash
        run: |
          mkdir -p .ci
          printf '[Common]\nhello=printf hello\n' > .ci/alias
          target/debug/aliasc compile --shell posix --platform linux --source .ci/alias --output .ci/posix.sh
          target/debug/aliasc compile --shell bash --platform linux --source .ci/alias --output .ci/bash.sh
          target/debug/aliasc compile --shell zsh --platform linux --source .ci/alias --output .ci/zsh.sh
          target/debug/aliasc compile --shell fish --platform linux --source .ci/alias --output .ci/fish.fish
          dash -n .ci/posix.sh
          bash -n .ci/bash.sh
          zsh -n .ci/zsh.sh
          fish --no-execute .ci/fish.fish

  windows-shells:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci | Out-Null
          "[Common]`nhello=echo hello" | Set-Content .ci/alias
          .\target\debug\aliasc.exe compile --shell powershell --platform windows --source .ci/alias --output .ci/aliases.ps1
          . .\.ci\aliases.ps1
          $actual = @(hello)
          if ($actual.Count -ne 1 -or $actual[0] -ne 'hello') {
            throw "Expected one 'hello' result, got: $($actual -join ', ')"
          }
      - shell: cmd
        run: |
          target\debug\aliasc.exe compile --shell cmd --platform windows --source .ci\alias --output .ci\aliases.mac
          call .ci\aliasc-runtime.cmd hello >NUL
