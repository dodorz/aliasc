name: Build And Release

on:
  push:
    branches:
      - "**"
    tags:
      - "*"

concurrency:
  group: build-release-${{ github.ref_type }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-version:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate and normalize release tag
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag '$REF_NAME'; expected MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            version="${REF_NAME#v}"
          else
            version=""
          fi
          echo "VERSION=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare-version
    env:
      VERSION: ${{ needs.prepare-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: aliasc-x86_64-pc-windows-msvc.exe
          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            asset: aliasc-i686-pc-windows-msvc.exe
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: aliasc-aarch64-pc-windows-msvc.exe
          - name: macOS Intel
            os: macos-14
            target: x86_64-apple-darwin
            asset: aliasc-x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            asset: aliasc-aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: aliasc-x86_64-unknown-linux-gnu
          - name: Android ARM64 (Termux)
            os: ubuntu-latest
            target: aarch64-linux-android
            asset: aliasc-aarch64-linux-android
            android_ndk: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Android NDK
        if: matrix.android_ndk
        id: android-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configure Android linker
        if: matrix.android_ndk
        shell: bash
        run: |
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${{ steps.android-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify Android ARM64 binary
        if: matrix.android_ndk
        shell: bash
        run: |
          readelf -h "target/${{ matrix.target }}/release/aliasc" | grep -Eq 'Machine:.*AArch64'

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/aliasc.exe" "${{ matrix.asset }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: cp "target/${{ matrix.target }}/release/aliasc" "${{ matrix.asset }}"

      - name: Verify Windows release binary version
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = (& ".\${{ matrix.asset }}" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $output -ne "aliasc $env:VERSION") {
            throw "Expected 'aliasc $env:VERSION', got '$output'"
          }

      - name: Verify Unix release binary version
        if: github.ref_type == 'tag' && runner.os != 'Windows' && !matrix.android_ndk
        shell: bash
        run: |
          output="$("./${{ matrix.asset }}" --version)"
          test "$output" = "aliasc $VERSION" || {
            echo "Expected 'aliasc $VERSION', got '$output'" >&2
            exit 1
          }

      - name: Verify Android release binary version
        if: github.ref_type == 'tag' && matrix.android_ndk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: arm64-v8a
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            adb push "${{ matrix.asset }}" /data/local/tmp/aliasc
            adb shell chmod 755 /data/local/tmp/aliasc
            output="$(adb shell /data/local/tmp/aliasc --version | tr -d '\r')"
            test "$output" = "aliasc $VERSION" || {
              echo "Expected 'aliasc $VERSION', got '$output'" >&2
              exit 1
            }

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare-version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare-version.outputs.version }}
    permissions:
      contents: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
