name: Build And Release

on:
  push:
    branches:
      - "**"
    tags:
      - "*"

concurrency:
  group: build-release-${{ github.ref_type }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: aliasc-x86_64-pc-windows-msvc.exe
          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            asset: aliasc-i686-pc-windows-msvc.exe
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: aliasc-aarch64-pc-windows-msvc.exe
          - name: macOS Intel
            os: macos-14
            target: x86_64-apple-darwin
            asset: aliasc-x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            asset: aliasc-aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: aliasc-x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/aliasc.exe" "${{ matrix.asset }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: cp "target/${{ matrix.target }}/release/aliasc" "${{ matrix.asset }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
