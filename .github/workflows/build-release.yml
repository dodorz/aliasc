name: Build And Release

on:
  push:
    branches:
      - "**"
    tags:
      - "*"

concurrency:
  group: build-release-${{ github.ref_type }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-version:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from Cargo.toml
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Cargo.toml is the single source of truth for the version.
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo.toml version '$version' is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag '$REF_NAME'; expected MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            # The tag only selects the release; it must name the package version.
            if [[ "${REF_NAME#v}" != "$version" ]]; then
              echo "Release tag '$REF_NAME' does not match Cargo.toml version '$version'" >&2
              exit 1
            fi
          fi
          echo "VERSION=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare-version
    env:
      VERSION: ${{ needs.prepare-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: aliasc-x86_64-pc-windows-msvc
            platform: windows-x86_64
          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            asset: aliasc-i686-pc-windows-msvc
            platform: windows-i686
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: aliasc-aarch64-pc-windows-msvc
            platform: windows-aarch64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            asset: aliasc-x86_64-apple-darwin
            platform: darwin-x86_64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            asset: aliasc-aarch64-apple-darwin
            platform: darwin-aarch64
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: aliasc-x86_64-unknown-linux-gnu
            platform: linux-x86_64-gnu
          - name: Linux x64 (musl)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: aliasc-x86_64-unknown-linux-musl
            platform: linux-x86_64-musl
            musl: true
          - name: Android ARM64 (Termux)
            os: ubuntu-latest
            target: aarch64-linux-android
            asset: aliasc-aarch64-linux-android
            platform: linux-aarch64-android
            android_ndk: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Android NDK
        if: matrix.android_ndk
        id: android-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configure Android linker
        if: matrix.android_ndk
        shell: bash
        run: |
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${{ steps.android-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Install musl toolchain
        if: matrix.musl
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static -C link-arg=-static"

      - name: Verify Android ARM64 binary
        if: matrix.android_ndk
        shell: bash
        run: |
          readelf -h "target/${{ matrix.target }}/release/aliasc" | grep -Eq 'Machine:.*AArch64'

      - name: Verify musl binary is statically linked
        if: matrix.musl
        shell: bash
        run: |
          file "target/${{ matrix.target }}/release/aliasc"
          ! readelf -l "target/${{ matrix.target }}/release/aliasc" | grep -q 'interpreter'

      # The bundle is the deliverable: compiler + glue + installer, archived as
      # a single .zip. Zip rather than 7z because every platform can extract it
      # with what it already ships (Explorer, unzip, bsdtar); 7z would make
      # extraction on Windows depend on a third-party install.
      # The bare binary is still emitted because alias-fetch.sh downloads it
      # when the glue is installed outside a bundle.
      - name: Assemble bundle (Unix)
        if: runner.os != 'Windows' && !matrix.android_ndk
        shell: bash
        run: |
          set -eu
          stage="bundle/${{ matrix.asset }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/aliasc" "$stage/aliasc"
          cp alias.sh alias.fish alias.nu alias.ps1 \
             alias-core.sh alias-fetch.sh alias-fallback.sh \
             alias-install.sh "$stage/"
          chmod 0755 "$stage/aliasc" "$stage/alias-install.sh" "$stage/alias-fetch.sh"
          cp "$stage/aliasc" "${{ matrix.asset }}"

      - name: Assemble bundle (Android)
        if: matrix.android_ndk
        shell: bash
        run: |
          set -eu
          stage="bundle/${{ matrix.asset }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/aliasc" "$stage/aliasc"
          cp alias.sh alias.fish alias.nu alias.ps1 \
             alias-core.sh alias-fetch.sh alias-fallback.sh \
             alias-install.sh "$stage/"
          chmod 0755 "$stage/aliasc" "$stage/alias-install.sh" "$stage/alias-fetch.sh"
          cp "$stage/aliasc" "${{ matrix.asset }}"

      # A Windows bundle carries the executable plus the PowerShell glue only:
      # alias.ps1 self-contained (no /bin/sh needed), alias-install.ps1 installs it.
      - name: Assemble bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "bundle/${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aliasc.exe" (Join-Path $stage 'aliasc.exe')
          foreach ($f in @('alias.ps1','alias-install.ps1')) {
            Copy-Item $f (Join-Path $stage $f)
          }
          Copy-Item (Join-Path $stage 'aliasc.exe') "${{ matrix.asset }}.exe"

      - name: Create zip bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          name="${{ matrix.asset }}"
          if command -v zip >/dev/null 2>&1; then
            # -X drops extra attributes so the archive is reproducible.
            ( cd "bundle/$name" && zip -r -X -9 "../../$name.zip" . >/dev/null )
          else
            # Fallback for runners without zip(1): Python is always present and
            # records the Unix modes explicitly, which zip(1) also does here.
            python3 tools/zip-bundle.py "bundle/$name" "$name.zip"
          fi

      - name: Create zip bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.asset }}"
          # Compress-Archive ships with PowerShell 5.1+, so no external tool is
          # needed. It does not record Unix modes, which is irrelevant for a
          # bundle holding only aliasc.exe and .ps1 files.
          Compress-Archive -Path "bundle/$name/*" -DestinationPath "$name.zip" -CompressionLevel Optimal -Force

      - name: Verify Windows release binary version
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = (& ".\${{ matrix.asset }}" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $output -ne "aliasc $env:VERSION") {
            throw "Expected 'aliasc $env:VERSION', got '$output'"
          }

      - name: Verify Unix release binary version
        if: github.ref_type == 'tag' && runner.os != 'Windows' && !matrix.android_ndk
        shell: bash
        run: |
          output="$("./${{ matrix.asset }}" --version)"
          test "$output" = "aliasc $VERSION" || {
            echo "Expected 'aliasc $VERSION', got '$output'" >&2
            exit 1
          }

      - name: Verify Android release binary version
        if: github.ref_type == 'tag' && matrix.android_ndk
        shell: bash
        run: |
          grep -aFq "$VERSION" "${{ matrix.asset }}" || {
            echo "Android binary does not contain expected version '$VERSION'" >&2
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          # The .zip is the deliverable. The bare binary stays in the release
          # so alias-fetch.sh can still bootstrap a glue-only install.
          path: |
            ${{ matrix.asset }}.zip
          if-no-files-found: error

      # The bare binaries stay in the release so `alias-fetch.sh` can still
      # bootstrap a glue-only install, and so Scoop manifests keep working.
      - name: Upload bare binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-binary
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.exe
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    needs: [prepare-version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare-version.outputs.version }}
    permissions:
      contents: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          (cd dist && sha256sum aliasc-* > checksums.txt)

      - name: Verify every platform produced a bundle
        shell: bash
        run: |
          set -eu
          expected=(
            aliasc-x86_64-pc-windows-msvc
            aliasc-i686-pc-windows-msvc
            aliasc-aarch64-pc-windows-msvc
            aliasc-x86_64-apple-darwin
            aliasc-aarch64-apple-darwin
            aliasc-x86_64-unknown-linux-gnu
            aliasc-x86_64-unknown-linux-musl
            aliasc-aarch64-linux-android
          )
          status=0
          for name in "${expected[@]}"; do
            if [[ ! -f "dist/$name.zip" ]]; then
              echo "missing bundle: dist/$name.zip" >&2
              status=1
            fi
          done
          exit $status

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
