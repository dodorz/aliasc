[package]
name = "aliasc"
version = "0.1.0"
edition = "2024"
description = "Alias DSL v2 compiler"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
